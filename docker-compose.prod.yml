# Kiwi 生产部署（Docker Compose）
#
#   cp .env.prod.example .env.prod    # 填写密码 / Fernet 密钥
#   (cd frontend && npm ci && npm run build)   # 前端在宿主机构建
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# 前端容器不再执行 npm / Vite 构建，只把宿主机的 frontend/dist 挂载进 nginx，
# 避免低内存主机在 Docker 构建阶段被 OOM 杀死。
#
# 后端源码（app / alembic）同样只读挂载进容器：日常改代码后执行
#   docker compose --env-file .env.prod -f docker-compose.prod.yml restart backend
# 即可生效，无需重新构建镜像；只有依赖变化（pyproject.toml / uv.lock /
# Dockerfile）时才需要 `up -d --build`。
#
# 默认端口均为非常规端口，避免与开发环境（5173 / 8000 / 5432 / 6333）冲突：
#   Web 18473 · API 18474 · PostgreSQL 15432 · Qdrant 16333 / 16334
# 仅 Web 端口对外监听，其余端口默认绑定 127.0.0.1。
# 需要让局域网内的本地开发实例直连数据库 / 向量库时，在 .env.prod 设置
#   POSTGRES_BIND=0.0.0.0
#   QDRANT_BIND=0.0.0.0
# 并用防火墙只放行开发机 IP（不要直接暴露到公网）。

name: kiwi-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kiwi-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kiwi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.prod 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kiwi}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kiwi} -d ${POSTGRES_DB:-kiwi}"]
      interval: 5s
      timeout: 5s
      retries: 24
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.19.2-unprivileged
    container_name: kiwi-prod-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_BIND:-127.0.0.1}:${QDRANT_HTTP_PORT:-16333}:6333"
      - "${QDRANT_BIND:-127.0.0.1}:${QDRANT_GRPC_PORT:-16334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      # Qdrant 官方镜像不含 curl / wget / nc，使用 bash 的 /dev/tcp 做 HTTP 就绪探测。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 24
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
      args:
        # 国内镜像默认值；海外网络可在 .env.prod 覆盖为官方源。
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/debian-security}
        # PostgreSQL 16 客户端（pg_dump 必须与服务端同大版本）。
        PGDG_MIRROR: ${PGDG_MIRROR:-https://mirrors.aliyun.com/postgresql/repos/apt}
        KIWI_BUILD_COMMIT: ${KIWI_BUILD_COMMIT:-}
        KIWI_BUILD_TIME: ${KIWI_BUILD_TIME:-}
    image: kiwi-backend:1.0.0
    container_name: kiwi-prod-backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      KIWI_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kiwi}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-kiwi}
      KIWI_QDRANT_URL: http://qdrant:6333
      KIWI_FERNET_KEY: ${KIWI_FERNET_KEY:?请在 .env.prod 中生成 KIWI_FERNET_KEY}
      KIWI_UPLOAD_DIR: /app/data/uploads
      KIWI_CORS_ORIGINS: '["${KIWI_PUBLIC_ORIGIN:-http://localhost:18473}"]'
      KIWI_LLM_TIMEOUT: ${KIWI_LLM_TIMEOUT:-600}
      # 可选访问控制：留空不启用；设置后浏览器会先进入令牌登录页。
      KIWI_ACCESS_TOKEN: ${KIWI_ACCESS_TOKEN:-}
      KIWI_ACCESS_COOKIE_NAME: ${KIWI_ACCESS_COOKIE_NAME:-kiwi_access}
      # 公网只读分享域名；留空时分享链接使用当前访问地址。
      KIWI_PUBLIC_BASE_URL: ${KIWI_PUBLIC_BASE_URL:-}
      KIWI_RATE_LIMIT_ENABLED: ${KIWI_RATE_LIMIT_ENABLED:-true}
      KIWI_RATE_LIMIT_LLM_PER_MINUTE: ${KIWI_RATE_LIMIT_LLM_PER_MINUTE:-20}
      KIWI_RATE_LIMIT_IMPORT_PER_MINUTE: ${KIWI_RATE_LIMIT_IMPORT_PER_MINUTE:-10}
      KIWI_RATE_LIMIT_CODE_PER_MINUTE: ${KIWI_RATE_LIMIT_CODE_PER_MINUTE:-30}
      # 自动备份：pg_dump + uploads + manifest，目录位于持久化数据卷。
      KIWI_BACKUP_ENABLED: ${KIWI_BACKUP_ENABLED:-true}
      KIWI_BACKUP_INTERVAL_HOURS: ${KIWI_BACKUP_INTERVAL_HOURS:-24}
      KIWI_BACKUP_RETENTION_DAYS: ${KIWI_BACKUP_RETENTION_DAYS:-14}
      KIWI_BACKUP_DIR: /app/data/backups
      # 后台任务与审计日志保留天数；0 表示不自动清理。
      KIWI_OPS_RETENTION_DAYS: ${KIWI_OPS_RETENTION_DAYS:-14}
      FASTEMBED_CACHE_PATH: /app/data/models/fastembed
      HF_HOME: /app/data/models/huggingface
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      # 无法运行本地嵌入模型时，可切换到 OpenAI 兼容的线上接口。
      KIWI_EMBED_PROVIDER: ${KIWI_EMBED_PROVIDER:-local}
      KIWI_EMBED_API_BASE: ${KIWI_EMBED_API_BASE:-}
      KIWI_EMBED_API_KEY: ${KIWI_EMBED_API_KEY:-}
      KIWI_EMBED_API_MODEL: ${KIWI_EMBED_API_MODEL:-text-embedding-3-small}
      KIWI_EMBED_API_TIMEOUT: ${KIWI_EMBED_API_TIMEOUT:-60}
      KIWI_EMBED_API_BATCH_SIZE: ${KIWI_EMBED_API_BATCH_SIZE:-64}
      KIWI_EMBED_API_CONCURRENCY: ${KIWI_EMBED_API_CONCURRENCY:-4}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 仅供本机调试 / API 文档；浏览器统一走 Web 端口的 /api 代理。
      - "127.0.0.1:${KIWI_API_PORT:-18474}:8000"
    volumes:
      - kiwi_data:/app/data
      # 源码只读挂载：重启容器即可加载最新代码，镜像中的依赖与环境保持不变。
      # 不使用 ./backend:/app，否则会遮住镜像内的 .venv 与已安装依赖。
      - type: bind
        source: ./backend/app
        target: /app/app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./backend/alembic
        target: /app/alembic
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./backend/alembic.ini
        target: /app/alembic.ini
        read_only: true
        bind:
          create_host_path: false
    # Notebook 的 bubblewrap 沙箱需要创建命名空间与挂载点。
    # 沙箱内部仍会 --cap-drop ALL、--unshare-* 并只挂载 /work。
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  frontend:
    # 直接使用 nginx 运行时镜像，前端在宿主机预先构建（见文件头注释）。
    # dist 只读挂载，重新执行 npm run build 后无需重建 / 重启容器。
    image: nginx:1.27-alpine
    container_name: kiwi-prod-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${KIWI_HTTP_PORT:-18473}:80"
    volumes:
      - type: bind
        source: ./deploy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      # 不自动创建空目录：缺少 dist 时直接报错，避免 nginx 返回空白页。
      - type: bind
        source: ./frontend/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  cloudflared:
    # 可选的 Cloudflare Tunnel（token 模式），仅在 `--profile cloudflare` 时启动。
    # 由 deploy.sh 向导或 `./deploy.sh cloudflare` 自动管理，也可手动启动：
    #   docker compose --env-file .env.prod -f docker-compose.prod.yml \
    #     --profile cloudflare up -d cloudflared
    # 在 Cloudflare Zero Trust 中把公网 Hostname 的 Service 指向
    # http://frontend:80，并且只放行 /share/、/api/share/、/assets/、/favicon。
    # Token 从 Zero Trust → Networks → Tunnels 获取，写入 .env.prod。
    image: cloudflare/cloudflared:latest
    container_name: kiwi-prod-cloudflared
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      frontend:
        condition: service_healthy
    logging: *default-logging

volumes:
  pgdata:
    name: kiwi-prod-pgdata
  qdrantdata:
    name: kiwi-prod-qdrantdata
  kiwi_data:
    name: kiwi-prod-data
