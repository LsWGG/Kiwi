<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05060b" />
  <meta name="robots" content="noindex" />
  <title>404 · Kiwi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b0e17'/%3E%3Ccircle cx='10' cy='9.5' r='2.6' fill='%23baf56d'/%3E%3Ccircle cx='22' cy='9.5' r='2.6' fill='%238b95ff'/%3E%3Ccircle cx='10' cy='22.5' r='2.6' fill='%235cf2b6'/%3E%3Ccircle cx='22' cy='22.5' r='2.6' fill='%23c88cff'/%3E%3C/svg%3E" />
  <style>
    :root {
      --text: #f2f5fa;
      --muted: #9aa4b7;
      --muted-2: #727d92;
      --line: rgba(255, 255, 255, 0.1);
      --mint: #5cf2b6;
      --lime: #baf56d;
      --indigo: #8b95ff;
      --mono: "SFMono-Regular", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
      --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(760px 520px at 50% -8%, rgba(139, 149, 255, 0.16), transparent 64%),
        radial-gradient(620px 420px at 84% 88%, rgba(92, 242, 182, 0.08), transparent 62%),
        #05060b;
      color: var(--text);
      font-family: var(--font);
      text-align: center;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 24%, rgba(255, 255, 255, 0.5), transparent 100%),
        radial-gradient(1px 1px at 78% 16%, rgba(255, 255, 255, 0.35), transparent 100%),
        radial-gradient(1.5px 1.5px at 68% 76%, rgba(186, 245, 109, 0.55), transparent 100%),
        radial-gradient(1px 1px at 26% 82%, rgba(139, 149, 255, 0.6), transparent 100%),
        radial-gradient(1px 1px at 44% 38%, rgba(255, 255, 255, 0.28), transparent 100%),
        radial-gradient(1px 1px at 88% 52%, rgba(255, 255, 255, 0.3), transparent 100%);
      opacity: 0.85;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 560px);
      padding: 48px 40px 42px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015));
      box-shadow: 0 48px 130px -48px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    .mark {
      display: block;
      width: 52px;
      height: 52px;
      margin: 0 auto 24px;
    }

    .code {
      margin: 0 0 14px;
      color: var(--mint);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 38px);
      font-weight: 620;
      letter-spacing: -0.03em;
      line-height: 1.25;
    }

    h1 span {
      background: linear-gradient(100deg, var(--lime), var(--mint) 55%, var(--indigo));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      margin: 16px auto 0;
      max-width: 400px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: border-color 0.22s, background 0.22s, transform 0.22s;
    }

    a:hover {
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    a.primary {
      border-color: transparent;
      background: linear-gradient(118deg, var(--lime), var(--mint));
      color: #04130c;
    }

    .foot {
      margin-top: 26px;
      color: var(--muted-2);
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.08em;
    }

    @media (max-width: 480px) {
      .card { padding: 38px 22px 34px; border-radius: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      a { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="mint" x1="7" y1="7" x2="25" y2="25" gradientUnits="userSpaceOnUse">
          <stop stop-color="#baf56d" />
          <stop offset="1" stop-color="#5cf2b6" />
        </linearGradient>
        <linearGradient id="indigo" x1="25" y1="7" x2="7" y2="25" gradientUnits="userSpaceOnUse">
          <stop stop-color="#8b95ff" />
          <stop offset="1" stop-color="#c88cff" />
        </linearGradient>
      </defs>
      <rect x="1" y="1" width="30" height="30" rx="9" fill="#0b0e17" stroke="rgba(255,255,255,.14)" />
      <path d="M10 9.5v13M22 9.5v13M10 9.5l12 13M22 9.5l-12 13" stroke="#2b3548" stroke-width="1.1" />
      <circle cx="10" cy="9.5" r="2.5" fill="url(#mint)" />
      <circle cx="22" cy="9.5" r="2.5" fill="url(#indigo)" />
      <circle cx="10" cy="22.5" r="2.5" fill="url(#mint)" />
      <circle cx="22" cy="22.5" r="2.5" fill="url(#indigo)" />
    </svg>

    <p class="code">404 · PAGE NOT COMPILED</p>
    <h1>这条路径，<br /><span>还没有被编译。</span></h1>
    <p>页面不存在或已移动。回到首页，看看 Kiwi 如何把笔记编译成真正学会的知识。</p>

    <div class="actions">
      <a class="primary" href="/Kiwi/">返回首页</a>
      <a href="https://github.com/LsWGG/Kiwi" target="_blank" rel="noopener">查看源码</a>
    </div>
    <p class="foot">KIWI · KNOWLEDGE COMPILER</p>
  </main>
</body>
</html>
