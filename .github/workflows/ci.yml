name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kiwi
          POSTGRES_PASSWORD: kiwi
          POSTGRES_DB: kiwi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiwi -d kiwi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      KIWI_TEST_DATABASE_URL: postgresql+asyncpg://kiwi:kiwi@localhost:5432/kiwi_test
      KIWI_QDRANT_URL: http://localhost:6333
      KIWI_BACKGROUND_JOBS: "false"
      KIWI_JOB_WORKER_ENABLED: "false"
      KIWI_ACCESS_TOKEN: ""
      KIWI_FERNET_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Lint
        working-directory: backend
        run: uv run ruff check app tests
      - name: Test
        working-directory: backend
        run: uv run pytest -q

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kiwi
          POSTGRES_PASSWORD: kiwi
          POSTGRES_DB: kiwi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiwi -d kiwi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      KIWI_DATABASE_URL: postgresql+asyncpg://kiwi:kiwi@localhost:5432/kiwi_test
      KIWI_QDRANT_URL: http://localhost:6333
      KIWI_BACKGROUND_JOBS: "false"
      # 导入任务保持排队，便于冒烟用例稳定断言进度状态。
      KIWI_JOB_WORKER_ENABLED: "false"
      KIWI_RATE_LIMIT_ENABLED: "false"
      KIWI_FERNET_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Migrate database
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Start backends
        working-directory: backend
        env:
          KIWI_UPLOAD_DIR: ${{ runner.temp }}/kiwi-uploads
        run: |
          mkdir -p "$KIWI_UPLOAD_DIR"
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          KIWI_ACCESS_TOKEN=smoke-token-123 \
            nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8012 \
            > "$RUNNER_TEMP/backend-auth.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null \
              && curl -fsS http://127.0.0.1:8012/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "后端启动超时"
          tail -50 "$RUNNER_TEMP/backend.log"
          tail -50 "$RUNNER_TEMP/backend-auth.log"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium --only-shell
      - name: Run Playwright smoke tests
        working-directory: frontend
        env:
          PW_BACKEND_URL: http://127.0.0.1:8000
          PW_TOKEN_BACKEND_URL: http://127.0.0.1:8012
          PW_ACCESS_TOKEN: smoke-token-123
        run: npm run test:e2e
      - name: Summarize Playwright failures
        if: failure()
        working-directory: frontend
        run: |
          node - <<'EOF'
          const fs = require('fs')
          const file = 'test-results/results.json'
          if (!fs.existsSync(file)) process.exit(0)
          const report = JSON.parse(fs.readFileSync(file, 'utf8'))
          const failed = []
          const walk = (suite, trail = []) => {
            for (const spec of suite.specs ?? []) {
              const results = (spec.tests ?? []).flatMap((test) => test.results ?? [])
              const last = results.at(-1)
              if (last && last.status !== 'passed' && last.status !== 'skipped') {
                failed.push([...trail, spec.title].join(' › '))
              }
            }
            for (const child of suite.suites ?? []) walk(child, [...trail, child.title])
          }
          for (const suite of report.suites ?? []) walk(suite)
          const body = failed.length ? failed.map((title) => `- ${title}`).join('\n') : '- 未解析到失败用例'
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Playwright 失败用例\n\n${body}\n`)
          for (const title of failed) console.log(`::error title=Playwright failure::${title}`)
          EOF
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/backend-auth.log
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: frontend
        run: npm run type-check
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload frontend build info
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-info
          path: frontend/dist/build-info.json
          if-no-files-found: error
