name: Windows 可行性 Spike

# Phase 0：在真正的 Windows 上验证桌面版打包依赖，结论写回 desktop/spike/out。
# 手动触发，或推送到 spike 分支时自动运行。

on:
  workflow_dispatch:
  push:
    branches: [feat/windows-desktop-spike]
    paths:
      - "desktop/spike/**"
      - ".github/workflows/windows-spike.yml"

concurrency:
  group: windows-spike-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Windows 控制台默认 cp1252，统一 UTF-8 避免中文输出导致脚本崩溃。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  pgserver:
    name: pgserver（启动 / 中文路径 / pg_dump / 重启）
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pgserver
        run: python -m pip install --disable-pip-version-check "pgserver==0.1.4"
      - name: Run pgserver spike
        shell: pwsh
        run: |
          $outLog = "$env:RUNNER_TEMP\pgserver.out.log"
          $errLog = "$env:RUNNER_TEMP\pgserver.err.log"
          # 不能用 2>&1：GitHub 的 pwsh 设置了 ErrorActionPreference=Stop，
          # 原生命令写 stderr 会被当成终止错误，后面的诊断逻辑根本不会执行。
          $code = 1
          $combined = @()
          try {
            # 不用 -Wait：PostgreSQL 子进程可能继承重定向句柄，PowerShell 会一直
            # 等输出流 EOF，导致作业在 30 分钟后被取消。这里只等待 python 进程，
            # 超时后强制结束整棵进程树，再由脚本落盘的结果诊断挂起位置。
            $proc = Start-Process -FilePath "python" `
              -ArgumentList @("-u", "-X", "faulthandler", "desktop/spike/check_pgserver.py") `
              -NoNewWindow -PassThru `
              -RedirectStandardOutput $outLog -RedirectStandardError $errLog
            if (-not $proc.WaitForExit(420000)) {
              $combined += "python 在 420 秒内未退出，强制结束进程树"
              & taskkill /T /F /PID $proc.Id 2>&1 | ForEach-Object { $combined += "$_" }
              $proc.WaitForExit(30000) | Out-Null
            }
            $code = if ($proc.HasExited) { $proc.ExitCode } else { 1 }
            foreach ($path in @($outLog, $errLog)) {
              if (Test-Path $path) {
                $combined += Get-Content -Path $path -ErrorAction SilentlyContinue
              }
            }
          } catch {
            $combined += "Start-Process 失败：$($_ | Out-String)"
          }
          $combined | ForEach-Object { Write-Host $_ }
          $out = 'desktop/spike/out/pgserver.json'
          if ($code -ne 0) {
            # 进程可能因原生崩溃来不及收尾；把脱敏后的日志尾部带回去。
            $safe = ($combined | Select-Object -Last 80 | ForEach-Object {
              $_ -replace '(postgres(?:ql)?://[^:\s]+:)[^@\s]+@', '$1***@'
            }) -join "`n"
            New-Item -ItemType Directory -Force -Path 'desktop/spike/out' | Out-Null
            if (Test-Path $out) {
              $data = Get-Content $out -Raw | ConvertFrom-Json
              $data | Add-Member -NotePropertyName log_tail -NotePropertyValue $safe -Force
              if ($data.status -eq 'pass') {
                # 检查项本身通过，但进程没有正常退出（例如输出句柄被子进程占用）。
                $data | Add-Member -NotePropertyName runner_error `
                  -NotePropertyValue "spike 进程以退出码 $code 结束，检查项已 pass 但进程未正常收尾" -Force
              } else {
                $data.status = 'fail'
              }
              $data | ConvertTo-Json -Depth 8 | Set-Content -Path $out -Encoding utf8
            } else {
              [ordered]@{
                check = 'pgserver'
                status = 'fail'
                steps = @()
                details = [ordered]@{}
                error = '脚本未写出结果（可能是原生崩溃）'
                log_tail = $safe
              } | ConvertTo-Json -Depth 6 | Set-Content -Path $out -Encoding utf8
            }
          }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-pgserver
          # 只传结构化结果：多路径 artifact 会保留各自相对路径，下载后不在 out/ 根目录。
          # 日志尾部已脱敏写入 pgserver.json 的 log_tail。
          path: desktop/spike/out/pgserver.json
          if-no-files-found: warn

  qdrant:
    name: Qdrant（Windows 二进制 / loopback / 就绪探测）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Qdrant spike
        shell: pwsh
        run: ./desktop/spike/check_qdrant.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-qdrant
          path: desktop/spike/out/qdrant.json
          if-no-files-found: warn

  portable-python:
    name: 便携 Python（numpy / pandas / matplotlib）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run portable Python spike
        shell: pwsh
        run: ./desktop/spike/check_portable_python.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-portable-python
          path: desktop/spike/out/portable-python.json
          if-no-files-found: warn

  pyinstaller:
    name: PyInstaller（依赖冻结 / 启动）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pyinstaller "fastapi~=0.143.3" "uvicorn[standard]~=0.34.0"
          "sqlalchemy[asyncio]~=2.1.5" "asyncpg~=0.32.0" "alembic~=1.20.0"
          "qdrant-client~=1.19.1" "openai~=1.107.0"
      - name: Run PyInstaller spike
        shell: pwsh
        run: ./desktop/spike/check_pyinstaller.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-pyinstaller
          path: desktop/spike/out/pyinstaller.json
          if-no-files-found: warn

  job-object:
    name: Job Object（KILL_ON_JOB_CLOSE / 进程树）
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psutil
        run: python -m pip install --disable-pip-version-check psutil
      - name: Run Job Object spike
        run: python desktop/spike/check_job_object.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-job-object
          path: desktop/spike/out/job-object.json
          if-no-files-found: warn

  webview2:
    name: WebView2（.NET 10 发布 / 运行时检测）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run WebView2 spike
        shell: pwsh
        run: ./desktop/spike/check_webview2.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-webview2
          path: desktop/spike/out/webview2.json
          if-no-files-found: warn

  backend-deps:
    name: 后端依赖（Windows 安装 / 导入 app.main）
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --no-dev
      - name: Import app.main
        working-directory: backend
        env:
          KIWI_UPLOAD_DIR: ${{ runner.temp }}/kiwi-uploads
        run: uv run python ../desktop/spike/check_backend_import.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-backend-deps
          path: desktop/spike/out/backend-deps.json
          if-no-files-found: warn

  report:
    name: 汇总结果
    if: always()
    needs: [pgserver, qdrant, portable-python, pyinstaller, job-object, webview2, backend-deps]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: spike-*
          path: desktop/spike/out
          merge-multiple: true
      - name: Compose summary
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 desktop/spike/collect_results.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${GITHUB_REF_NAME}"
          if [ -d desktop/spike/out ] && [ -n "$(ls -A desktop/spike/out)" ]; then
            # 只提交结构化结果与汇总，不上传可能包含连接信息的原始日志。
            git add desktop/spike/out/*.json desktop/spike/out/SUMMARY.md
            if git diff --cached --quiet; then
              echo "结果无变化，跳过提交"
            else
              git commit -m "chore(spike): 记录 Windows 可行性结果 [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "没有结果文件可提交"
          fi
