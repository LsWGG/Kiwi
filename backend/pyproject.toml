[project]
name = "kiwi-backend"
version = "1.0.0"
description = "Kiwi — 个人知识编译与检索系统（阶段一后端）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi~=0.143.3",
    "uvicorn[standard]~=0.34.0",
    "sqlalchemy[asyncio]~=2.1.5",
    "asyncpg~=0.32.0",
    "alembic~=1.20.0",
    "pydantic~=2.14.1",
    "pydantic-settings~=2.9.0",
    "qdrant-client~=1.19.1",
    "fastembed~=0.9.0",
    "openai~=1.107.0",
    "cryptography~=50.0.2",
    "python-multipart~=0.0.20",
    "pymupdf~=1.28.2",
    "python-docx~=1.1.0",
    "markdown-it-py~=3.0.0",
    "aiofiles~=24.1.0",
    "python-dotenv~=1.0.1",
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
    "lxml>=5.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "pandas>=3.0.6",
    "matplotlib>=3.11.2",
    "pywebpush>=2.5.0",
    "faster-whisper>=1.2.1",
    # av 16+ 移除了 decode_audio 依赖的 metadata_errors 参数，锁在兼容区间。
    "av>=12,<16",
]

[project.optional-dependencies]
dev = [
    "ruff~=0.12.0",
    "pytest~=8.4.0",
    "pytest-asyncio~=0.26.0",
    "httpx~=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 所有异步测试共享一个事件循环，避免 asyncpg 连接池跨 loop 复用。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
