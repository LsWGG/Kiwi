# Kiwi 生产前端：静态资源 + /api、/media 反向代理。
# 后端地址通过 Docker 内置 DNS 动态解析，backend 重启换 IP 后无需重启 nginx。

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端单文件导入上限 200MB，预留 multipart 开销。
    client_max_body_size 220m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API、SSE 流式响应：关闭缓冲，放宽读超时（LLM 默认 10 分钟）。
    location /api/ {
        set $kiwi_backend http://backend:8000;
        proxy_pass $kiwi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 附件与编辑器内嵌媒体。
    location /media/ {
        set $kiwi_backend http://backend:8000;
        proxy_pass $kiwi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Vite 产物带内容哈希，长期缓存。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
